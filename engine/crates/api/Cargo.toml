[package]
name = "api"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Presentation boundary: thin axum REST + WebSocket surface over the application layer."

[features]
# Mirrors serial-can's: a build without it still compiles and reports serial as unavailable.
default = ["serial"]
serial = ["serial-can/serial", "bridge/serial"]

[dependencies]
application.workspace = true
ecu.workspace = true
simulation.workspace = true
serial-can.workspace = true
bridge.workspace = true
isotp.workspace = true
slcan.workspace = true
core-domain.workspace = true
axum.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# `start_paused` runs the response emitter against tokio's virtual clock, so the timing test
# asserts real millisecond behaviour without actually waiting. It lives behind `test-util`,
# which the workspace's "full" feature set does not include.
tokio = { workspace = true, features = ["test-util"] }
# Drive the router directly in-process, so a route that is declared but unreachable (a wrong
# path-parameter syntax, say) fails a test rather than only showing up against a running engine.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
