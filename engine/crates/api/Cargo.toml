[package]
name = "api"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Presentation boundary: thin axum REST + WebSocket surface over the application layer."

[dependencies]
application.workspace = true
ecu.workspace = true
simulation.workspace = true
core-domain.workspace = true
axum.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# `start_paused` runs the response emitter against tokio's virtual clock, so the timing test
# asserts real millisecond behaviour without actually waiting. It lives behind `test-util`,
# which the workspace's "full" feature set does not include.
tokio = { workspace = true, features = ["test-util"] }
