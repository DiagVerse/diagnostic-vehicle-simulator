[package]
name = "simulation"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Simulation use case: hold a loaded vehicle and route UDS requests to virtual ECUs by CAN address."

[dependencies]
can.workspace = true
core-domain.workspace = true
# For the one thing routing needs from ISO 13400-2: which target addresses are a functional
# group rather than an ECU. The codec itself stays in the DoIP layer.
doip.workspace = true
application.workspace = true
ecu.workspace = true
reconstruct.workspace = true
simfile.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Only the plan executor needs a clock; everything else in this crate is pure.
tokio = { workspace = true }

[dev-dependencies]
# The round-trip tests drive the real UDS logic (linked as an rlib) rather than a stub, so
# routing is proven against the same protocol implementation the engine loads as a plugin.
uds-plugin.workspace = true
plugin-contract.workspace = true
abi_stable.workspace = true
