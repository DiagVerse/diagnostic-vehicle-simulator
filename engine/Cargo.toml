# Virtual workspace for the Diagnostic Vehicle Simulator engine.
# Dependencies point inward (hexagonal): core-domain depends on nothing engine-specific;
# plugins depend on plugin-contract; api/app wire everything together.
[workspace]
resolver = "2"
members = [
    "crates/core-domain",
    "crates/plugin-contract",
    "crates/application",
    "crates/api",
    "crates/app",
    "crates/ecu",
    "crates/can",
    "crates/isotp",
    "crates/pcap",
    "crates/doip",
    "crates/doip-server",
    "crates/reconstruct",
    "crates/simulation",
    "crates/serial-can",
    "crates/slcan",
    "crates/bridge",
    "crates/simfile",
    "plugins/sample",
    "plugins/protocols/l7-application/uds",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.98"

# Shared dependency versions so every crate stays in lockstep.
[workspace.dependencies]
# Stable-ABI plugin boundary.
abi_stable = "0.11"
# Async runtime + web.
tokio = { version = "1", features = ["full"] }
# `multipart` so a PDX upload can carry several per-ECU files at once, which is how a
# delivery is usually handed over.
axum = { version = "0.7", features = ["multipart"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
# Serialization.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Logging / diagnostics.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Errors.
thiserror = "1"
anyhow = "1"
# Scratch space for handing an uploaded archive to the PDX converter and cleaning up after it.
tempfile = "3"
# Only for the one thing std cannot express: a second UDP socket sharing a port, so a DoIP
# discovery answer can be pinned to the interface the entity was bound to.
socket2 = { version = "0.5", features = ["all"] }

# Internal crates.
core-domain = { path = "crates/core-domain" }
plugin-contract = { path = "crates/plugin-contract" }
application = { path = "crates/application" }
api = { path = "crates/api" }
ecu = { path = "crates/ecu" }
can = { path = "crates/can" }
isotp = { path = "crates/isotp" }
pcap = { path = "crates/pcap" }
doip = { path = "crates/doip" }
doip-server = { path = "crates/doip-server" }
reconstruct = { path = "crates/reconstruct" }
simulation = { path = "crates/simulation" }
serial-can = { path = "crates/serial-can" }
slcan = { path = "crates/slcan" }
bridge = { path = "crates/bridge" }
simfile = { path = "crates/simfile" }
uds-plugin = { path = "plugins/protocols/l7-application/uds" }

[profile.release]
lto = "thin"
